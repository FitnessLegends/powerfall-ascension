name: Powerfall Stability

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: powerfall-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Syntax, invariants and simulation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test

  browsers:
    name: Chromium + WebKit gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
